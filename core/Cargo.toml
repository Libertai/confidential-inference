[package]
name = "confidential-inference-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Verification core for LibertAI confidential inference: RA-TLS attestation of Aleph V-PROGRAMs. No network, no TLS — compiles to wasm32."

[dependencies]
sev = { version = "8", default-features = false, features = ["snp", "crypto_nossl"] }
x509-parser = "0.16"
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
sha3 = "0.10"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
serde_json = "1"
