# Tag a release to publish. Wheels are abi3, so one per platform covers every
# Python from 3.9 up.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  wheels:
    strategy:
      matrix:
        # `macos-latest` is arm64 and `ubuntu-latest` is x64, so Intel Macs and
        # aarch64 Linux would otherwise find nothing to download. Linux arm64 has
        # its own runner; the Intel-Mac wheel is cross-compiled from the arm64
        # runner instead, because the only x86_64 macOS image (macos-13) is on
        # its way out and jobs queue for a long time waiting for one.
        include:
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
          - os: macos-latest
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: --release --out dist --manifest-path python/Cargo.toml
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target || 'native' }}
          path: dist

  # The fallback for anything the matrix misses: it vendors the sibling core
  # crate, so it builds from source on a platform with a Rust toolchain.
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path python/Cargo.toml
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist

  pypi:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    # Trusted publishing: no long-lived token lives in this repository.
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "{wheels-*,sdist}"
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    runs-on: ubuntu-latest
    # Must match the environment on the npm trusted publisher: npm checks the
    # claim, and a token minted outside it is refused.
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs npm >= 11.5.1 and node >= 22.14.
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install
        working-directory: js
      - run: npm run build
        working-directory: js
      # No token and no --provenance: the OIDC identity authorises the publish
      # and npm attaches provenance by itself.
      #
      # Skipped when the version is already on the registry, so re-running a
      # release -- or tagging a version whose npm half went out by hand -- does
      # not fail the run on an immutable-version 403.
      - name: publish unless this version is already published
        working-directory: js
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@libertai/confidential-inference@$version" version >/dev/null 2>&1; then
            echo "@libertai/confidential-inference@$version is already published; skipping"
          else
            npm publish --access public
          fi
