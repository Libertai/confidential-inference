MODEL_ALIAS=qwen3.8-27b-tee
# vLLM's V2 model runner passes input_ids/positions to the GPU as UVA views of
# pinned host memory. A GPU in NVIDIA CC mode cannot read guest memory directly,
# and those views never see later host writes, so the model reads all-zero
# input_ids and emits token 0 ("!") forever, with no error anywhere.
# Upstream bug: https://github.com/vllm-project/vllm/issues/57224
#
# 8 images per prompt is what the gateway's MAX_IMAGES_PER_REQUEST admits;
# vLLM rejecting fewer than the gateway forwards would surface as a 400 from
# inside the enclave. Video stays off: it is not served.
#
# 262144 is the native context; the YaRN override extends it to 1M, per the
# model card. YaRN is static, so it is on for short prompts too.
VLLM_ENV="VLLM_USE_V2_MODEL_RUNNER=0 VLLM_ALLOW_LONG_MAX_MODEL_LEN=1"
VLLM_ARGS="--max-model-len 1000000 --hf-overrides {\"text_config\":{\"rope_parameters\":{\"mrope_interleaved\":true,\"mrope_section\":[11,11,10],\"rope_type\":\"yarn\",\"rope_theta\":10000000,\"partial_rotary_factor\":0.25,\"factor\":4.0,\"original_max_position_embeddings\":262144}}} --max-num-seqs 64 --gpu-memory-utilization 0.90 --limit-mm-per-prompt {\"image\":8,\"video\":0} --reasoning-parser qwen3 --enable-auto-tool-choice --tool-call-parser qwen3_xml"
