[package]
name = "confidential-inference-python"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
confidential-inference-core = { path = "../core" }
# abi3 so one wheel per platform covers every Python from 3.9 up.
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
