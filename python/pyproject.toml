[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "libertai-confidential-inference"
version = "0.0.1"
description = "Verify you are talking to LibertAI inference running in an attested confidential VM, then talk to it directly."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["httpx>=0.27"]

[tool.maturin]
# Ships the marker that tells type checkers this package is annotated.
include = ["libertai_confidential/py.typed"]
features = ["pyo3/extension-module"]
module-name = "libertai_confidential._core"
python-source = "."
manifest-path = "Cargo.toml"
